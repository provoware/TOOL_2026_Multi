name: Iteration 33 Patch anwenden

on:
  push:
    branches:
      - iteration-33-highzoom-window-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Branch holen
        uses: actions/checkout@v7.0.1
        with:
          ref: iteration-33-highzoom-window-ux
      - name: Geprüften Patch anwenden
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/_iter33_apply.py
          python3 -m py_compile app/ui.py app/calendar_window.py app/laptop_layout.py app/navigation_ux.py app/ui_standards.py tests/test_dashboard_reference_gui.py tests/test_navigation_ux_gui.py tests/test_calendar_gui.py
          rm scripts/_iter33_apply.py .github/workflows/iteration33-patch.yml
          git config user.name 'provoware-bot'
          git config user.email 'provoware-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Iteration 33: 200-Prozent-UX und Modulfenster härten'
          git push origin HEAD:iteration-33-highzoom-window-ux
