name: Iteration 38 Gate-Evidenz synchronisieren

on:
  push:
    branches:
      - iteration-38-window-ux
    paths:
      - '.github/workflows/sync-iteration38-evidence.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          ref: iteration-38-window-ux
          fetch-depth: 0

      - name: Evidenz mit Guards synchronisieren
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Guard fehlgeschlagen: {path}: {old!r} nicht genau einmal gefunden')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'MANIFEST.json',
              '''    "iteration38_initial_ci_result": "pending",\n    "iteration38_expected_logic_tests": 113,\n    "iteration38_expected_gui_tests": 83,\n    "iteration38_expected_release_files": 48\n''',
              '''    "iteration38_initial_ci_run": 795,\n    "iteration38_initial_ci_result": "failure",\n    "iteration38_initial_ci_cause": "83 GUI-Tests liefen; zwei Screenreader-Prüfungen blockierten wegen nicht normalisiertem Qt-Text für Hilfe && Fehlerhilfe",\n    "iteration38_technical_ci_run": 799,\n    "iteration38_technical_ci_result": "success",\n    "iteration38_technical_tested_head_sha": "0c77b8143a7bde8e7b93134bb376726b7373c464",\n    "iteration38_logic_tests": 113,\n    "iteration38_gui_tests": 83,\n    "iteration38_release_files": 48,\n    "iteration38_native_wayland_smoke": true,\n    "iteration38_restore_gate": true,\n    "iteration38_restore_status": "OK",\n    "iteration38_restore_sha256": "900e08dbad15d13e005f559715ec2f41c4260f6e53ad1395a3f3c4c243912bd9",\n    "iteration38_runtime_release_sha256": "a626f93eade99b5ba4b486b1e9bd60552f17f231ab8c23a4e0adb2b39d39158c",\n    "iteration38_technical_artifact_id": 10291505732,\n    "iteration38_final_head_gate": "required_after_evidence_sync"\n''')

          replace_once(
              'TODO.md',
              '- [ ] Iteration-38-CI, nativer Wayland-Smoke, Restore und ZIP-Artefakte vollständig grün bestätigen',
              '- [x] technischer Iteration-38-Gate #799: 113 Logiktests, 83 GUI-Tests, 48 Release-Dateien, nativer Wayland-Smoke, Restore und ZIP-Artefakte vollständig grün')

          replace_once(
              'CHANGELOG.md',
              '- CI-/Wayland-/Restore-/ZIP-Abnahme: ausstehend bis zum Iteration-38-Branch-Gate.',
              '- erster PR-Gate #795 blockierte korrekt wegen zwei Screenreader-Assertions; die zentrale Accessibility-Normalisierung wurde ursächlich korrigiert.\n- technischer Gate #799 vollständig grün: 113 Logik-/Regressionstests, 83 GUI-Tests, 48 Release-Dateien, nativer Qt-Wayland-Start und Restore `OK`.\n- Restore-SHA-256: `900e08dbad15d13e005f559715ec2f41c4260f6e53ad1395a3f3c4c243912bd9`; Runtime-Release-SHA-256: `a626f93eade99b5ba4b486b1e9bd60552f17f231ab8c23a4e0adb2b39d39158c`.\n- finaler Head-Gate nach Synchronisierung dieser Evidenz bleibt vor dem Merge verpflichtend.')

          replace_once(
              'docs/ITERATION38_WINDOW_UX.md',
              'Der erneute vollständige CI-/Wayland-/Restore-/ZIP-Gate auf dem korrigierten Iteration-38-Head ist noch ausstehend. Eine reale Sichtprüfung auf Kubuntu 26.04 / Plasma Wayland bleibt zusätzlich erforderlich, besonders bei 1366×768 und 125/150/175/200 %.',
              'Der korrigierte technische Head `0c77b8143a7bde8e7b93134bb376726b7373c464` wurde in Grundprüfung **#799** vollständig bestätigt: **113 Logik-/Regressionstests**, **83 GUI-Tests**, **48 Release-Dateien**, Headless-Start und nativer Qt-Wayland-Smoke waren grün. Der Vollprojekt-Restore meldete `OK` mit SHA-256 `900e08dbad15d13e005f559715ec2f41c4260f6e53ad1395a3f3c4c243912bd9`; das Runtime-Release hat SHA-256 `a626f93eade99b5ba4b486b1e9bd60552f17f231ab8c23a4e0adb2b39d39158c`. Nach Synchronisierung dieser Evidenz bleibt ein finaler Head-Gate vor dem Merge verpflichtend. Eine reale Sichtprüfung auf Kubuntu 26.04 / Plasma Wayland bleibt zusätzlich erforderlich, besonders bei 1366×768 und 125/150/175/200 %.')
          PY

      - name: Einmal-Workflow entfernen und Evidenz schreiben
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/sync-iteration38-evidence.yml
          git add -A
          git diff --cached --check
          git config user.name 'provoware-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Iteration 38: technischen Gate #799 dokumentieren'
          git push origin HEAD:iteration-38-window-ux
