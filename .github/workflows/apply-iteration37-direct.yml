name: Iteration 37 Reständerungen anwenden

on:
  push:
    branches:
      - iteration-37-maintenance-help
    paths:
      - .github/workflows/apply-iteration37-direct.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Exakte Reständerungen anwenden
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: erwartet 1 Treffer, gefunden {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Navigation
          replace_once('app/navigation_ux.py', 'recovery = _find_button(widgets, "Fehlerhilfe")', 'recovery = _find_button(widgets, "Hilfe & Fehlerhilfe")')
          replace_once('app/navigation_ux.py', 'self._set_ready_button(recovery, "⚕  Fehlerhilfe (Recovery)"),', 'self._set_ready_button(recovery, "ⓘ  Hilfe & Fehlerhilfe"),')
          replace_once('app/navigation_ux.py', '"⚕  Fehlerhilfe" if high_zoom else "⚕  Fehlerhilfe (Recovery)",', '"ⓘ  Hilfe" if high_zoom else "ⓘ  Hilfe & Fehlerhilfe",')

          # Dashboard + F1
          replace_once('app/ui.py', 'self.recovery_nav_button = self._add_nav(layout, "  ⚕  Fehlerhilfe (Recovery)", self.open_recovery)', 'self.recovery_nav_button = self._add_nav(layout, "  ⓘ  Hilfe & Fehlerhilfe", self.open_recovery)')
          replace_once('app/ui.py', 'QShortcut(QKeySequence("Ctrl+R"), self, activated=self.open_recovery)\n', 'QShortcut(QKeySequence("Ctrl+R"), self, activated=self.open_recovery)\n        QShortcut(QKeySequence("F1"), self, activated=self.open_recovery)\n')
          replace_once('app/ui.py', 'Projekt-Notiz konnte nicht gespeichert werden. Öffne bei Bedarf die Fehlerhilfe.', 'Projekt-Notiz konnte nicht gespeichert werden. Öffne bei Bedarf Hilfe & Fehlerhilfe.')
          replace_once('app/ui.py', 'Profile konnten nicht geladen werden. Öffne die Fehlerhilfe, wenn das Problem bleibt.', 'Profile konnten nicht geladen werden. Öffne Hilfe & Fehlerhilfe, wenn das Problem bleibt.')
          replace_once('app/ui.py', 'Profilwerte konnten nicht geladen werden. Öffne bei Bedarf die Fehlerhilfe.', 'Profilwerte konnten nicht geladen werden. Öffne bei Bedarf Hilfe & Fehlerhilfe.')
          replace_once('app/ui.py', 'Kalender-Erinnerungen konnten nicht geprüft werden. Öffne bei Bedarf die Fehlerhilfe.', 'Kalender-Erinnerungen konnten nicht geprüft werden. Öffne bei Bedarf Hilfe & Fehlerhilfe.')
          replace_once('app/ui.py', 'Öffnen Sie die Fehlerhilfe (Recovery) und folgen Sie dem dort genannten Schritt.', 'Öffnen Sie Hilfe & Fehlerhilfe und folgen Sie dem dort genannten Schritt.')

          # GUI-Regressionen
          replace_once('tests/test_dashboard_reference_gui.py', 'if "Recovery" in button.text()', 'if "Hilfe & Fehlerhilfe" in button.text()')
          replace_once('tests/test_layman_ux_gui.py', 'self.assertIn("Fehlerhilfe", recovery.windowTitle())', 'self.assertIn("Hilfe & Fehlerhilfe", recovery.windowTitle())')
          replace_once('tests/test_navigation_ux_gui.py', 'self.assertEqual(self.dashboard.recovery_nav_button.text(), "⚕  Fehlerhilfe")', 'self.assertEqual(self.dashboard.recovery_nav_button.text(), "ⓘ  Hilfe")')
          replace_once('tests/test_navigation_ux_gui.py', 'self.assertIn("Recovery", self.dashboard.recovery_nav_button.accessibleName())', 'self.assertIn("Hilfe", self.dashboard.recovery_nav_button.accessibleName())')
          replace_once('tests/test_navigation_ux_gui.py', 'self.assertEqual(self.dashboard.recovery_nav_button.text(), "⚕  Fehlerhilfe (Recovery)")', 'self.assertEqual(self.dashboard.recovery_nav_button.text(), "ⓘ  Hilfe & Fehlerhilfe")')
          PY

          rm -f .github/workflows/apply-iteration37-direct.yml
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Iteration 37: Navigation, F1 und GUI-Regressionen abschließen"
          git push origin HEAD:iteration-37-maintenance-help
