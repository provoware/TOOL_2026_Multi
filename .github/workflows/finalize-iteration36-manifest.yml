name: Iteration 36 Manifest-Sync

on:
  push:
    branches:
      - iteration-36-manifest-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
      - name: Manifest synchronisieren und Einmal-Helfer entfernen
        run: |
          set -Eeuo pipefail
          python3 scripts/finalize_iteration36_manifest.py
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Iteration 36: Manifest auf freigegebenen Hauptstand synchronisieren"
          git push origin "HEAD:${GITHUB_REF_NAME}"
