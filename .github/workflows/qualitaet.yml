name: Grundprüfung

on:
  push:
  pull_request:

jobs:
  grundpruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4
      - name: Tk-Prüfumgebung bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
      - name: Vollständige Grundprüfung ausführen
        run: bash scripts/pruefen.sh --full
      - name: Vollprojekt wiederherstellen und prüfen
        run: python3 scripts/iteration_restore.py --output-dir "$RUNNER_TEMP/tool_restore"
