name: Grundprüfung

on:
  push:
  pull_request:

jobs:
  grundpruefung:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
      - name: PySide6-Prüfumgebung bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 weston
          python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Vollständige Grundprüfung ausführen
        run: bash scripts/pruefen.sh --full
      - name: Nativen Qt-Wayland-Start prüfen
        env:
          QT_QPA_PLATFORM: wayland
        run: |
          set -Eeuo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/provoware-wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 --log="$RUNNER_TEMP/provoware-weston.log" &
          WESTON_PID=$!
          cleanup(){ kill "$WESTON_PID" >/dev/null 2>&1 || true; wait "$WESTON_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-ci" ]] && break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/wayland-ci" ]]; then
            cat "$RUNNER_TEMP/provoware-weston.log" >&2 || true
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-ci
          python3 scripts/wayland_smoke.py
      - name: UI-Qualitätsanalyse erzeugen (Shadow)
        id: ui_shadow
        run: |
          set -Eeuo pipefail
          PROFILE="pr"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then PROFILE="release"; fi
          mkdir -p "$RUNNER_TEMP/ui-shadow"
          set +e
          python3 scripts/ui_shadow_entry.py --profile "$PROFILE" --output-dir "$RUNNER_TEMP/ui-shadow"
          SHADOW_RC=$?
          set -e
          printf '%s\n' "$SHADOW_RC" > "$RUNNER_TEMP/ui-shadow/runner_exit_code.txt"
          echo "exit_code=$SHADOW_RC" >> "$GITHUB_OUTPUT"
          case "$SHADOW_RC" in
            0) echo "UI-Shadow: keine harten UI-Befunde." ;;
            1) echo "::notice::UI-Shadow hat UI-Befunde erkannt. In Iteration 39 bleiben diese nicht blockierend." ;;
            2) echo "::warning::UI-Shadow-Prüfsystem meldet einen Infrastrukturfehler. Der abschließende Infrastruktur-Gate wird den Job rot markieren." ;;
            *) echo "::warning::UI-Shadow lieferte unerwarteten Exitcode $SHADOW_RC. Der abschließende Infrastruktur-Gate entscheidet anhand der Evidenz." ;;
          esac
          exit 0
      - name: UI-Shadow-Evidenz bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOOL_2026_Multi-ui-shadow-${{ github.run_number }}
          path: ${{ runner.temp }}/ui-shadow/**
          if-no-files-found: warn
          retention-days: 30
      - name: Vollprojekt wiederherstellen und prüfen
        run: python3 scripts/iteration_restore.py --output-dir "$RUNNER_TEMP/tool_restore"
      - name: Geprüfte ZIP-Pakete erzeugen
        run: |
          set -Eeuo pipefail
          python3 scripts/veroeffentlichen.py
          VERSION="$(python3 -c 'import json; print(json.load(open("MANIFEST.json", encoding="utf-8"))["tool"]["version"])')"
          FULL="release/TOOL_2026_Multi_${VERSION}_vollstaendiges-projekt.zip"
          git archive --format=zip --output="$FULL" HEAD
          sha256sum "$FULL" > "$FULL.sha256"
      - name: Geprüfte ZIP-Pakete bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TOOL_2026_Multi-gepruefte-pakete
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: UI-Shadow-Infrastruktur hart validieren
        if: always()
        run: |
          set -Eeuo pipefail
          python3 scripts/ui_shadow_entry.py --validate-evidence "$RUNNER_TEMP/ui-shadow/ui_shadow_evidence.json"
