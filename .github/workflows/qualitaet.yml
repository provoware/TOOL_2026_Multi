name: Grundprüfung

on:
  push:
  pull_request:

jobs:
  grundpruefung:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
      - name: PySide6-Prüfumgebung bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 weston
          python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Vollständige Grundprüfung ausführen
        run: bash scripts/pruefen.sh --full
      - name: Nativen Qt-Wayland-Start prüfen
        env:
          QT_QPA_PLATFORM: wayland
        run: |
          set -Eeuo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/provoware-wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 --log="$RUNNER_TEMP/provoware-weston.log" &
          WESTON_PID=$!
          cleanup(){ kill "$WESTON_PID" >/dev/null 2>&1 || true; wait "$WESTON_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-ci" ]] && break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/wayland-ci" ]]; then
            cat "$RUNNER_TEMP/provoware-weston.log" >&2 || true
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-ci
          python3 scripts/wayland_smoke.py
      - name: Vollprojekt wiederherstellen und prüfen
        run: python3 scripts/iteration_restore.py --output-dir "$RUNNER_TEMP/tool_restore"

      - name: Finalen main 0.16.0 exakt verpacken
        if: github.ref == 'refs/heads/package-0.16.0-artifact'
        run: |
          set -Eeuo pipefail
          FINAL_SHA='aeb4086e1d20f68a753e9a204ee8bf0d29ddf746'
          OUT="$RUNNER_TEMP/provoware_final"
          mkdir -p "$OUT"
          git fetch --no-tags --depth=1 origin "$FINAL_SHA"
          git archive --format=zip --prefix='TOOL_2026_Multi_0.16.0/' "$FINAL_SHA" > "$OUT/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip"
          (cd "$OUT" && sha256sum TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip > TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip.sha256)
          unzip -t "$OUT/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip"
          unzip -p "$OUT/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip" 'TOOL_2026_Multi_0.16.0/MANIFEST.json' | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['tool']['version']=='0.16.0'; assert m['iteration']['number']==28; assert sum(1 for f in m['files'] if f.get('release'))==38"
          git ls-tree -r --name-only "$FINAL_SHA" | LC_ALL=C sort > "$OUT/expected.txt"
          unzip -Z1 "$OUT/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip" | sed 's#^TOOL_2026_Multi_0.16.0/##' | sed '/^$/d' | grep -v '/$' | LC_ALL=C sort > "$OUT/actual.txt"
          diff -u "$OUT/expected.txt" "$OUT/actual.txt"
          rm "$OUT/expected.txt" "$OUT/actual.txt"

      - name: ZIP und Prüfsumme bereitstellen
        if: github.ref == 'refs/heads/package-0.16.0-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland
          path: |
            ${{ runner.temp }}/provoware_final/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip
            ${{ runner.temp }}/provoware_final/TOOL_2026_Multi_0.16.0_Kubuntu-26.04_Wayland.zip.sha256
          if-no-files-found: error
          compression-level: 0
