name: Iteration 37 Freigabemetadaten synchronisieren

on:
  push:
    branches:
      - iteration-37-maintenance-help
    paths:
      - .github/workflows/finalize-iteration37-metadata.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Metadaten und Dokumentation synchronisieren
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/sync_iteration37_metadata.py')
          text = path.read_text(encoding='utf-8')
          old = 'end = r.index("\\n## Anzeige und Zoom\\n", start)'
          new = 'end = r.index("\\n## Datensicherheit\\n", start)'
          if text.count(old) != 1:
              raise SystemExit(f'README-Endmarker im Syncskript nicht eindeutig: {text.count(old)} Treffer')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/sync_iteration37_metadata.py

      - name: Einmalige Sync-Helfer entfernen und Ergebnis schreiben
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/sync_iteration37_metadata.py
          rm -f .github/workflows/finalize-iteration37-metadata.yml
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Iteration 37: Version 0.17.2 und Freigabedokumentation synchronisieren"
          git push origin HEAD:iteration-37-maintenance-help
