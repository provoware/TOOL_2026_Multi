name: Iteration 37 Freigabemetadaten synchronisieren

on:
  push:
    branches:
      - iteration-37-maintenance-help
    paths:
      - .github/workflows/finalize-iteration37-metadata.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Metadaten und Dokumentation synchronisieren
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/sync_iteration37_metadata.py')
          text = path.read_text(encoding='utf-8')

          old_marker = 'end = r.index("\\n## Anzeige und Zoom\\n", start)'
          new_marker = 'end = r.index("\\n## Datensicherheit\\n", start)'
          if text.count(old_marker) != 1:
              raise SystemExit(f'README-Endmarker im Syncskript nicht eindeutig: {text.count(old_marker)} Treffer')
          text = text.replace(old_marker, new_marker, 1)

          old_pair = '''replace_once("ANLEITUNG_LAIEN.md", "- **Fehlerhilfe (Recovery)**", "- **Hilfe & Fehlerhilfe**")\nreplace_once("ANLEITUNG_LAIEN.md", "- **Fehlerhilfe (Recovery)**", "- **Hilfe & Fehlerhilfe**")'''
          new_pair = '''menu_path = Path("ANLEITUNG_LAIEN.md")\nmenu_text = menu_path.read_text(encoding="utf-8")\nold_menu = "- **Fehlerhilfe (Recovery)**"\nif menu_text.count(old_menu) != 2:\n    raise SystemExit(f"ANLEITUNG: erwartet 2 Hilfe-Menüeinträge, gefunden {menu_text.count(old_menu)}")\nmenu_path.write_text(menu_text.replace(old_menu, "- **Hilfe & Fehlerhilfe**"), encoding="utf-8")'''
          if text.count(old_pair) != 1:
              raise SystemExit(f'ANLEITUNG-Ersetzungsblock im Syncskript nicht eindeutig: {text.count(old_pair)} Treffer')
          path.write_text(text.replace(old_pair, new_pair, 1), encoding='utf-8')
          PY
          python3 scripts/sync_iteration37_metadata.py

      - name: Einmalige Sync-Helfer entfernen und Ergebnis schreiben
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/sync_iteration37_metadata.py
          rm -f .github/workflows/finalize-iteration37-metadata.yml
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Iteration 37: Version 0.17.2 und Freigabedokumentation synchronisieren"
          git push origin HEAD:iteration-37-maintenance-help
