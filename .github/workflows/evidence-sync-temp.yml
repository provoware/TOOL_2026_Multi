name: Temporärer Evidence-Sync 30-32

on:
  push:
    branches:
      - iteration-30-32-evidence-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: iteration-30-32-evidence-sync
          fetch-depth: 1
      - name: Dokumentationsstand 30-32 synchronisieren
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: erwartete genau 1 Fundstelle, gefunden {count}")
              return text.replace(old, new, 1)

          manifest_path = Path("MANIFEST.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest = replace_once(manifest, '"schema_version": 25', '"schema_version": 26', "Manifest-Schema")
          manifest = replace_once(
              manifest,
              '"iteration": {\n    "number": 29,\n    "goal": "Darstellungszustände zentral, deterministisch und Qt-unabhängig klassifizieren und Runtime-Release-Vollständigkeit erzwingen",\n    "completed": 10,\n    "open_next": 1\n  }',
              '"iteration": {\n    "number": 32,\n    "goal": "Codequalität der Log- und Dashboard-Infrastruktur durch deterministische Wartungslogik, typisierten Fenster-Lebenszyklus und zentrale Managed-Window-Registry konsolidieren",\n    "completed": 3,\n    "open_next": 1\n  }',
              "Iterationskopf",
          )
          manifest = replace_once(
              manifest,
              '    "iteration29_final_head_gate": "success"\n',
              '    "iteration29_final_head_gate": "success",\n'
              '    "iteration30_ci_run": 628,\n'
              '    "iteration30_ci_result": "success",\n'
              '    "iteration30_logic_tests": 96,\n'
              '    "iteration30_gui_tests": 56,\n'
              '    "iteration30_release_files": 39,\n'
              '    "iteration30_native_wayland_smoke": true,\n'
              '    "iteration30_restore_gate": true,\n'
              '    "iteration30_restore_status": "OK",\n'
              '    "iteration30_restore_sha256": "c45fa475055dfb1b5d3e5904321f4d967c96a3ea5d3f82bba46bdb6538ad574c",\n'
              '    "iteration30_tested_head_sha": "2c76d6a1ec8bd86c00125094809fcedc315775da",\n'
              '    "iteration30_merged_main_sha": "20a9106616e4f32677c271906f345f02652b7cdd",\n'
              '    "iteration31_ci_run": 633,\n'
              '    "iteration31_ci_result": "success",\n'
              '    "iteration31_logic_tests": 96,\n'
              '    "iteration31_gui_tests": 59,\n'
              '    "iteration31_release_files": 39,\n'
              '    "iteration31_native_wayland_smoke": true,\n'
              '    "iteration31_restore_gate": true,\n'
              '    "iteration31_restore_status": "OK",\n'
              '    "iteration31_restore_sha256": "8d6f15df599d92ad60be71fab18c171243cbdfbf5fb55e4d236d23cbec79819a",\n'
              '    "iteration31_tested_head_sha": "6f69c163b88f3d024b670298d70c755a0c1bb82d",\n'
              '    "iteration31_merged_main_sha": "c4df362e8518acab07d4aac987ce08b5ff7e60b6",\n'
              '    "iteration32_ci_run": 638,\n'
              '    "iteration32_ci_result": "success",\n'
              '    "iteration32_logic_tests": 96,\n'
              '    "iteration32_gui_tests": 62,\n'
              '    "iteration32_release_files": 39,\n'
              '    "iteration32_native_wayland_smoke": true,\n'
              '    "iteration32_restore_gate": true,\n'
              '    "iteration32_restore_status": "OK",\n'
              '    "iteration32_restore_sha256": "64c3d081f652abcb29623375336c4d71b5ffd55ebce72e2c33cae64e83cef51b",\n'
              '    "iteration32_tested_head_sha": "873401955bfb4805b4cdfc09c836de6818601709",\n'
              '    "iteration32_merged_main_sha": "a0032bc7977e21d830297828610d9b6d3ac68ea3",\n'
              '    "iteration32_final_head_gate": "success"\n',
              "Iterations-Evidence",
          )
          manifest = replace_once(
              manifest,
              '    "navigation_planned_hidden_in_laptop_and_high_zoom": true\n',
              '    "navigation_planned_hidden_in_laptop_and_high_zoom": true,\n'
              '    "managed_window_registry": "app.ui.Dashboard._managed_window_registry",\n'
              '    "managed_window_registry_single_source": true,\n'
              '    "managed_window_registry_scope": ["managed_widget_detection", "zoom_distribution", "visible_refresh"],\n'
              '    "managed_window_refresh_scope": ["recovery", "todo", "calendar"]\n',
              "Managed-Window-Metadaten",
          )
          manifest = replace_once(
              manifest,
              '    {"path":"docs/ITERATION29_PRESENTATION_POLICY.md","release":false,"purpose":"Architekturanalyse, Präsentationspolicy, Release-Vollständigkeit und CI-/Restore-Evidence"}\n',
              '    {"path":"docs/ITERATION29_PRESENTATION_POLICY.md","release":false,"purpose":"Architekturanalyse, Präsentationspolicy, Release-Vollständigkeit und CI-/Restore-Evidence"},\n'
              '    {"path":"docs/ITERATION30_LOG_MAINTENANCE_CODE_QUALITY.md","release":false,"purpose":"Codequalitäts-Härtung der Log-Wartung und CI-/Restore-Evidence"},\n'
              '    {"path":"docs/ITERATION31_WINDOW_LIFECYCLE.md","release":false,"purpose":"Typisierter Fenster-Lebenszyklus, Regression und CI-/Restore-Evidence"},\n'
              '    {"path":"docs/ITERATION32_MANAGED_WINDOW_REGISTRY.md","release":false,"purpose":"Zentrale Managed-Window-Registry, Zoom-/Refresh-Konsistenz und CI-/Restore-Evidence"}\n',
              "Iterationsdokumente im Manifest",
          )
          manifest_path.write_text(manifest, encoding="utf-8")

          todo_path = Path("TODO.md")
          todo = todo_path.read_text(encoding="utf-8")
          todo_insert = '''## Iteration 30 – Codequalität der Log-Wartung

**Hauptziel:** Log-Wartung deterministischer, kohärenter und besser testbar machen, ohne Produkt- oder Nutzerdatenlogik zu verändern.

- 🟢 Zeitlogik pro Wartungsoperation auf einen UTC-Snapshot begrenzt.
- 🟢 Rotationsentscheidung als reine, dateisystemunabhängige Funktion getrennt.
- 🟢 Quarantäne-JSON auf den zentralen atomaren JSON-Schreiber umgestellt.
- 🟢 Archivsortierung gegen parallel verschwundene Dateien robuster gemacht.
- 🟢 Grundprüfung **#628**: 96 Logiktests, 56 GUI-Tests, 39 Release-Dateien, Headless-Start, nativer Wayland-Smoke und Restore `OK`.
- 🟢 Restore-SHA-256 `c45fa475055dfb1b5d3e5904321f4d967c96a3ea5d3f82bba46bdb6538ad574c`.
- 🟢 PR #40 gemergt; Main-Commit `20a9106616e4f32677c271906f345f02652b7cdd`.

## Iteration 31 – Fenster-Lebenszyklus zentralisieren

**Hauptziel:** Wiederholte Öffnen-/Aktivieren-/Aktualisieren-Logik der Dashboard-Nebenfenster in einen typisierten Helfer überführen.

- 🟢 generischen `_open_managed_window()`-Helfer eingeführt.
- 🟢 sichtbare Fenster werden zentral vorbereitet, aktiviert und aktualisiert.
- 🟢 bisherige Unterschiede bleiben erhalten: Kalender darf verborgenen Zustand wiederverwenden; Profile, Todo, Songbibliothek und Recovery behalten ihre bisherige Neuerzeugungssemantik.
- 🟢 drei deterministische Lebenszyklus-Regressionen ergänzt.
- 🟢 Grundprüfung **#633**: 96 Logiktests, 59 GUI-Tests, 39 Release-Dateien, Headless-Start, nativer Wayland-Smoke und Restore `OK`.
- 🟢 Restore-SHA-256 `8d6f15df599d92ad60be71fab18c171243cbdfbf5fb55e4d236d23cbec79819a`.
- 🟢 PR #41 gemergt; Main-Commit `c4df362e8518acab07d4aac987ce08b5ff7e60b6`.

## Iteration 32 – Managed-Window-Registry zentralisieren

**Hauptziel:** Alle aktuell verwalteten Dashboard-Fenster als gemeinsame Quelle für Erkennung, Zoom-Verteilung und selektiven Refresh führen.

- 🟢 `_managed_window_registry()` als Single Source of Truth eingeführt.
- 🟢 Ctrl+Mausrad-/Fenstererkennung und Zoom-Verteilung verwenden dieselbe Registry.
- 🟢 Dashboard-Refresh verwendet die Registry mit explizitem `refresh_when_visible`; automatisch aktualisiert werden unverändert Recovery, Todo und Kalender.
- 🟢 Songeditor-Sonderbehandlung bleibt als eigener Zoom-Adapter erhalten.
- 🟢 drei neue GUI-Regressionen prüfen Registry-Vollständigkeit, Zoom-Verteilung und unveränderten Refresh-Scope.
- 🟢 Grundprüfung **#638**: 96 Logiktests, 62 GUI-Tests, 39 Release-Dateien, Headless-Start, nativer Wayland-Smoke und Restore `OK`.
- 🟢 Restore-SHA-256 `64c3d081f652abcb29623375336c4d71b5ffd55ebce72e2c33cae64e83cef51b`.
- 🟢 PR #42 gemergt; aktueller technischer Main-Commit vor diesem Evidence-Sync: `a0032bc7977e21d830297828610d9b6d3ac68ea3`.

'''
          todo = replace_once(todo, '## Danach\n', todo_insert + '## Danach\n', "TODO-Insert")
          todo_path.write_text(todo, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_insert = '''## 0.16.1 – 2026-09-10 – Codequalitäts-Nachhärtung (Iterationen 30–32)

### Iteration 30 – Log-Wartung
- Zeitermittlung pro Wartungsoperation auf einen UTC-Snapshot vereinheitlicht,
- Rotationsentscheidung als reine Logik getrennt,
- Quarantäne-JSON auf den zentralen atomaren JSON-Schreiber umgestellt,
- Archivsortierung robuster gegen parallel verschwundene Dateien gemacht,
- Grenzwert- und Zeitkonsistenzregressionen ergänzt.

### Iteration 31 – Fenster-Lebenszyklus
- wiederholte Dashboard-Fensterverwaltung in den generischen, typisierten `_open_managed_window()`-Helfer zusammengeführt,
- sichtbare Wiederverwendung, standardmäßige Neuerzeugung und bewusste Kalender-Hidden-Reuse-Semantik explizit erhalten,
- drei deterministische Lebenszyklus-Regressionen ergänzt.

### Iteration 32 – Managed-Window-Registry
- `_managed_window_registry()` als zentrale Quelle der aktuell verwalteten Dashboard-Fenster eingeführt,
- Fenstererkennung für Ctrl+Mausrad, Zoom-Verteilung und selektiven sichtbaren Refresh auf dieselbe Registry vereinheitlicht,
- Recovery, Todo und Kalender bleiben der bewusste automatische Refresh-Scope; Songeditoren behalten ihren speziellen Zoom-Adapter,
- drei GUI-Regressionen für Registry-Vollständigkeit, Zoom-Verteilung und Refresh-Semantik ergänzt.

### Schutz und Abnahme
- keine sichtbaren Texte, Layouts, Themes oder Bedienpfade verändert,
- keine Song-, Profil-, Todo- oder Kalenderdaten oder Speicherformate verändert,
- keine Backup-, Restore- oder Release-Fachlogik verändert und keine neue Abhängigkeit eingeführt,
- Iteration 30: Grundprüfung **#628** vollständig grün – 96 Logiktests, 56 GUI-Tests, 39 Release-Dateien, nativer Qt-Wayland-Smoke und Restore `OK`; Restore-SHA-256 `c45fa475055dfb1b5d3e5904321f4d967c96a3ea5d3f82bba46bdb6538ad574c`; PR #40 → Main `20a9106616e4f32677c271906f345f02652b7cdd`,
- Iteration 31: Grundprüfung **#633** vollständig grün – 96 Logiktests, 59 GUI-Tests, 39 Release-Dateien, nativer Qt-Wayland-Smoke und Restore `OK`; Restore-SHA-256 `8d6f15df599d92ad60be71fab18c171243cbdfbf5fb55e4d236d23cbec79819a`; PR #41 → Main `c4df362e8518acab07d4aac987ce08b5ff7e60b6`,
- Iteration 32: Grundprüfung **#638** vollständig grün – 96 Logiktests, 62 GUI-Tests, 39 Release-Dateien, nativer Qt-Wayland-Smoke und Restore `OK`; Restore-SHA-256 `64c3d081f652abcb29623375336c4d71b5ffd55ebce72e2c33cae64e83cef51b`; PR #42 → Main `a0032bc7977e21d830297828610d9b6d3ac68ea3`.

'''
          changelog = replace_once(changelog, '# Änderungsverlauf\n\n', '# Änderungsverlauf\n\n' + changelog_insert, "CHANGELOG-Insert")
          changelog_path.write_text(changelog, encoding="utf-8")

          Path(".github/workflows/evidence-sync-temp.yml").unlink()
          PY
          python3 -m json.tool MANIFEST.json >/dev/null
          git diff --check
          git config user.name "provoware-evidence-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          git commit -m "Dokumentationsstand Iterationen 30-32 synchronisieren"
          git push origin HEAD:iteration-30-32-evidence-sync
