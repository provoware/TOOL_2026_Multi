name: Iteration 34 Evidence-Sync

on:
  push:
    branches:
      - iteration-34-final-evidence-sync
    paths:
      - scripts/iteration34_evidence_sync.py
      - .github/workflows/iteration34-evidence-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Iteration 34 Evidence-Sync starten'
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          ref: iteration-34-final-evidence-sync
      - name: Finalen Nachweisstatus synchronisieren
        run: python3 scripts/iteration34_evidence_sync.py
      - name: Änderungen validieren und committen
        run: |
          set -Eeuo pipefail
          python3 -m json.tool MANIFEST.json >/dev/null
          git diff --check
          git config user.name "provoware"
          git config user.email "provoware.one@gmail.com"
          git add MANIFEST.json TODO.md CHANGELOG.md docs/ITERATION34_CORE_MODULES_DATA_STANDARDS.md
          git commit -m "Iteration 34: finalen Freigabenachweis synchronisieren"
          git push origin HEAD:iteration-34-final-evidence-sync
