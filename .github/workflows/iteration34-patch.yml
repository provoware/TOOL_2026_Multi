name: Iteration 34 Refinement anwenden

on:
  push:
    branches:
      - iteration-34-core-modules-data-standards
    paths:
      - scripts/iteration34_refine.py
      - .github/workflows/iteration34-patch.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Iteration 34 Refinement starten'
    runs-on: ubuntu-latest
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7.0.1
        with:
          ref: iteration-34-core-modules-data-standards
      - name: Gezieltes Refinement anwenden
        run: python3 scripts/iteration34_refine.py
      - name: Ergebnis committen
        run: |
          set -Eeuo pipefail
          git config user.name "provoware"
          git config user.email "provoware.one@gmail.com"
          git add app tests scripts MANIFEST.json
          git diff --cached --check
          git commit -m "Iteration 34: Regressionen, Todo-Details und Release-Liste synchronisieren"
          git push origin HEAD:iteration-34-core-modules-data-standards
